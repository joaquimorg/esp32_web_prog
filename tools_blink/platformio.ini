[platformio]
default_envs = esp32-s3-devkitc-1, esp32dev, esp32-c3-devkitm-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_PIN=48
    -DBOARD_NAME=\"ESP32-S3\"

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DLED_PIN=2
    -DBOARD_NAME=\"ESP32\"

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_PIN=8
    -DBOARD_NAME=\"ESP32-C3\"
